name: Frontend Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ionic-build:
    name: ionic-build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Frontend submodule
        working-directory: .
        run: git submodule update --init --depth 1 Frontend

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm run test.unit -- --run

      - name: Build the app
        run: npm run build

  e2e-tests:
    name: e2e-tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: Frontend

    env:
      REACT_APP_BACKEND_PROTOCOL: http
      REACT_APP_BACKEND_URL: localhost
      REACT_APP_BACKEND_PORT: 8080
      REACT_APP_BACKEND_PATH: api
      REACT_APP_BACKEND_WS_PROTOCOL: http
      REACT_APP_BACKEND_WS_URL: localhost
      REACT_APP_BACKEND_WS_PORT: 8080
      REACT_APP_BACKEND_WS_PATH: api/ws

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Frontend submodule
        working-directory: .
        run: git submodule update --init --depth 1 Frontend

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: ./node_modules/.bin/cypress install

      - name: Start dev server
        run: |
          npm run dev -- --port 5173 --strictPort > dev-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:5173; then
              exit 0
            fi
            sleep 1
          done
          echo "Dev server did not start within 60 seconds:"
          cat dev-server.log
          exit 1

      - name: Run E2E tests
        run: npm run test.e2e

  docker-test:
    name: docker-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Frontend submodule
      run: git submodule update --init --depth 1 Frontend

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: Frontend
        file: Frontend/Dockerfile
        push: false
        load: true
        tags: docker-test-react:latest
        cache-from: type=gha,scope=frontend-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
