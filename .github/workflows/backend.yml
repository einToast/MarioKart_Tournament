name: Backend Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  maven-build:
    name: maven-build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: Backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Backend submodule
      working-directory: .
      run: git submodule update --init --depth 1 Backend

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: Backend/pom.xml

    - name: Build with Maven
      run: mvn -B package --file pom.xml

  docker-test:
    name: docker-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Backend submodule
      run: git submodule update --init --depth 1 Backend

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: Backend
        file: Backend/Dockerfile
        push: false
        load: true
        tags: docker-test-java:latest
        cache-from: type=gha,scope=backend-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
