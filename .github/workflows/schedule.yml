name: Schedule Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-test:
    name: python-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: Schedule

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Schedule submodule
      working-directory: .
      run: git submodule update --init --depth 1 Schedule

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: Schedule/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --require-hashes --only-binary :all: -r requirements.txt

    - name: Run Tests
      run: python -m unittest discover -s tests -v

  webserver-test:
    name: webserver-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: Schedule

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Schedule submodule
      working-directory: .
      run: git submodule update --init --depth 1 Schedule

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: 'pip'
        cache-dependency-path: Schedule/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --require-hashes --only-binary :all: -r requirements.txt

    - name: Start Webserver in Background
      run: |
        nohup python src/webserver.py > webserver.log 2>&1 & echo $! > server.pid

    - name: Wait for Webserver to become healthy
      run: |
        curl --fail --silent --show-error \
             --retry 15 --retry-delay 2 --retry-connrefused \
             http://localhost:8000/healthcheck

    - name: Show server logs on failure
      if: failure()
      run: |
        echo "--- webserver.log (tail) ---"; tail -n 200 webserver.log || true

    - name: Stop Webserver
      if: always()
      run: |
        if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

  docker-test:
    name: docker-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out Schedule submodule
      run: git submodule update --init --depth 1 Schedule

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: Schedule
        file: Schedule/Dockerfile
        push: false
        load: true
        tags: docker-test-schedule:latest
        cache-from: type=gha,scope=schedule-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=schedule-${{ matrix.arch }}
