name: OCR Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python-test:
    name: python-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: OCR

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out OCR submodule
      working-directory: .
      run: git submodule update --init --depth 1 OCR

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: OCR/pyproject.toml
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: OCR/uv.lock

    - name: Install dependencies
      run: uv sync --locked --no-build

    - name: Run tests
      run: uv run --locked --no-build pytest

  webserver-test:
    name: webserver-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: OCR

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out OCR submodule
      working-directory: .
      run: git submodule update --init --depth 1 OCR

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: OCR/pyproject.toml
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: OCR/uv.lock

    - name: Install dependencies
      run: uv sync --locked --no-build

    - name: Start Webserver in Background
      run: |
        nohup uv run --locked --no-build fastapi dev src/webserver.py --port 8001 > webserver.log 2>&1 & echo $! > server.pid

    - name: Wait for Webserver to become healthy
      run: |
        curl --fail --silent --show-error \
             --retry 15 --retry-delay 2 --retry-connrefused \
             http://localhost:8001/healthcheck

    - name: Test Webserver provider
      run: curl -f http://localhost:8001/providers

    - name: Show server logs on failure
      if: failure()
      run: |
        echo "--- webserver.log (tail) ---"; tail -n 200 webserver.log || true

    - name: Stop Webserver
      if: always()
      run: |
        if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

  docker-test:
    name: docker-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out OCR submodule
      run: git submodule update --init --depth 1 OCR

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: OCR
        file: OCR/Dockerfile
        push: false
        load: true
        tags: docker-test-ocr:latest
        cache-from: type=gha,scope=ocr-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=ocr-${{ matrix.arch }}
